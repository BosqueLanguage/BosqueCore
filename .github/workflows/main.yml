name: nodeci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: 'true'
    - name: Setup
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Dependencies (io_uring)
      run: sudo apt-get update && sudo apt-get install -y liburing-dev
    - name: Install Dependencies (ssl)
      run: sudo apt-get update && sudo apt-get install -y libssl-dev
    - name: Install Dependencies (ssl)
      run: sudo apt-get update && sudo apt-get install -y libicu-dev
    - name: Install Dependencies (boost)
      run: sudo apt-get install -y libboost-all-dev
    - name: Install
      run: npm install
    - name: Run Tests
      run: npm test
    
